name: Bug report
description: Report a reproducible problem in HackTrack
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, follow SECURITY.md instead of opening a public issue."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v0.1.0 or commit SHA"
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: Include Node.js version, OS, browser, and relevant logs. Remove secrets and personal data.
